name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          mkdir -p temp_unzip
          unzip -o PackSound2.zip -d temp_unzip
          # Mueve todo el contenido interno a la raíz del repositorio
          find temp_unzip -mindepth 2 -type f -exec mv {} ./ \; 2>/dev/null || true
          find temp_unzip -mindepth 2 -type d -exec mv {} ./ \; 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission and build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PackSound-apk
          path: app/build/outputs/apk/debug/app-debug.apk
