name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -o PackSound.zip

      - name: Grant execute permission for gradlew
        run: chmod +x PackSound/gradlew

      - name: Build APK with Gradle
        run: cd PackSound && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PackSound-apk
          path: PackSound/app/build/outputs/apk/debug/app-debug.apk

